<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miravis</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="app">
    <video id="v1" class="video-layer active" muted playsinline autoplay></video>
    <video id="v2" class="video-layer" muted playsinline autoplay></video>

    <audio autoplay loop id="audio-sound">
        <source src="assets/sounds/sound.mp3" type="audio/mpeg">
        <!-- <source src="путь_к_вашему_файлу.ogg" type="audio/ogg"> -->
        Ваш браузер не поддерживает элемент audio.
    </audio>


    <audio id="audio-click">
        <source src="assets/sounds/click.mp3" type="audio/mpeg">
        <!-- <source src="путь_к_вашему_файлу.ogg" type="audio/ogg"> --> 
        Ваш браузер не поддерживает элемент audio.
    </audio>

      

    <div class="ui-layer">
        <div id="text-container"></div>
        <div id="steps-container">
            <div class="step">
                <span class="step-text"></span>
            </div>
            <div class="step">
                <span class="step-text"></span>
            </div>
            <div class="step">
                <span class="step-text"></span>
            </div>
        </div>
        <button id="action-btn"></button>
    </div>
</div>

<script src="assets/js/main.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const music = document.getElementById('audio-sound');
        const click = document.getElementById('audio-click');

        if (music) music.volume = 0.3; // gromkost' 10%
        if (click) click.volume = 0.2; // gromkost' 20%
    });
</script>
</body>
</html>
